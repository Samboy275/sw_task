version: '3.8'


services:
  web_service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - sw_task_network
    depends_on:
      - DB

  DB:
    image: mysql:8.0
    container_name: DB
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    ports:
      - '3307:3306'
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sw_task_network

networks:
  sw_task_network:
    driver : bridge

volumes:
  db_data:
    driver: local
